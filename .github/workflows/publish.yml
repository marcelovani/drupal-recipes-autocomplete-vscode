name: Publish

# Publishes the extension when a version tag is pushed, e.g.
#   git tag v1.1.2 && git push origin v1.1.2
# Both registries are published from the same run so they cannot drift: the
# Visual Studio Marketplace, which only VS Code itself installs from, and Open
# VSX, which is what the forks use (Windsurf, Devin, VSCodium, code-server).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check, but do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # vsce publishes whatever version package.json holds; the tag is only a
      # label. Publishing v1.1.2 while package.json still said 1.1.1 would
      # silently republish the old version. Fail loudly instead.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - run: npm ci

      - run: npm run compile-tests

      - run: npm run typecheck

      - run: npm run lint

      - name: Run tests
        run: xvfb-run -a npm test

      # A bad .vscodeignore is invisible until someone downloads the extension.
      - run: npm run verify:package

      - name: Build the vsix
        run: npx vsce package --out drupal-recipes-autocomplete-vscode.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: drupal-recipes-autocomplete-vscode.vsix

      - name: Publish to the Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        run: npx vsce publish --packagePath drupal-recipes-autocomplete-vscode.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Fails the run rather than passing quietly. continue-on-error was worse
      # than useless here: it sets the step's conclusion to success while the
      # outcome is a failure, so the 1.1.2 release showed a green tick for a
      # step that had died on a missing token, and the only evidence was in the
      # logs. A release that reached one registry and not the other must be
      # obvious.
      - name: Publish to Open VSX
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT is not set, so Open VSX was not published. See docs/releasing.md."
            exit 1
          fi
          npx ovsx publish drupal-recipes-autocomplete-vscode.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        run: |
          # The changelog entry for this version: from its heading to the next.
          notes="$(awk '/^## /{ if (seen) exit; if ($2 == version) { seen = 1 } } seen' \
            version="${GITHUB_REF_NAME#v}" CHANGELOG.md)"

          if [ -z "$notes" ]; then
            echo "::warning::no CHANGELOG entry found for ${GITHUB_REF_NAME#v}"
            notes="See CHANGELOG.md."
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            drupal-recipes-autocomplete-vscode.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
